name: Argus Review

# Reusable + standalone PR-review workflow.
#
# xspan-ai fork. Differences from upstream karlmehta/argus:
#   • Secrets are declared explicitly under workflow_call.secrets, so callers
#     pass exactly the LLM credential and never `secrets: inherit`.
#   • The harness is split by what is genuinely shared vs genuinely local.
#     actions/checkout in a reusable workflow checks out the CALLER, so
#     upstream's repo-root paths resolved to nothing and the reviewer ran
#     unguided. Now: the shared rubrics (prompts/, skills/) are checked out
#     from this repo at `harness-ref` into .argus/, while each consuming repo
#     keeps its own .github/argus/config.yml and .github/argus/memory/.
#     Memory stays local on purpose — accepted-patterns.md is a standing
#     security-exception list, and an exception granted in one repo must not
#     silently apply to the others.
#   • Comment re-runs are restricted to org members/collaborators.
#
# Argus reads the diff and the surrounding code, applies each enabled review
# skill, cross-checks against the repo's memory, and posts ONE consolidated
# review with severity-ranked, file:line-cited findings.
#
# Verdict policy (see docs/governance.md):
#   • request-changes  — when a `blocker`/`major` finding is confirmed
#   • comment          — the default: findings surfaced, human sign-off still required
#   • approve          — OFF by default. Only enabled when a maintainer sets
#                        `verdict.allow_approve: true` in the caller's
#                        .github/argus/config.yml AND the change is genuinely
#                        clean. Argus never approves to merely clear a required-
#                        review gate; whether a bot approval counts toward branch
#                        protection is a repo-owner decision.

on:
  workflow_call:
    inputs:
      config-path:
        description: Path to argus config, relative to the calling repo.
        type: string
        default: .github/argus/config.yml
      model:
        description: Model id passed to claude-code-action.
        type: string
        default: claude-sonnet-4-6
      harness-ref:
        description: >-
          Ref of xspan-ai/argus to take the shared rubrics from. Callers should
          pass the same commit SHA they pin `uses:` to — a mismatch means the
          review policy in force is not the one that was reviewed.
        type: string
        default: main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: Claude Code OAuth token. Takes precedence when both are set.
        required: false
      ANTHROPIC_API_KEY:
        description: Anthropic API key. Used when no OAuth token is set.
        required: false
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write        # required by claude-code-action for OIDC to api.anthropic.com

concurrency:
  group: argus-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # Non-draft same-repo PRs (forks can't read secrets) + "@argus" mentions from
    # people who can actually write to the repo (a comment burns an LLM run).
    if: >
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@argus') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for conflict + base-diff analysis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # On issue_comment the default checkout is the default branch, not the
          # PR head — check out the PR so a re-run reviews the code under review.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}

      - name: Checkout the shared Argus rubrics
        uses: actions/checkout@v4
        with:
          repository: xspan-ai/argus
          ref: ${{ inputs.harness-ref || 'main' }}
          path: .argus

      - name: Require an LLM credential
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
            echo "::error title=Argus has no LLM credential::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY reached this workflow. claude-code-action exits SUCCESS when unauthenticated, so without this guard the job reports a green check having reviewed nothing. Check that the caller maps a secret that exists in the calling repo."
            exit 1
          fi

      - name: Run Argus
        id: argus
        uses: anthropics/claude-code-action@v1
        with:
          # Either secret works; CLAUDE_CODE_OAUTH_TOKEN takes precedence if set.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are **Argus**, this repository's automated PR reviewer.
            Review pull request #${{ github.event.pull_request.number || github.event.issue.number }}.

            Two locations matter, and the distinction is deliberate:
              • `.argus/` — the shared org rubrics (prompts, skills). Same for
                every repo. Read-only policy.
              • `.github/argus/` — THIS repo's own config and memory. Local.
            Follow the harness instructions exactly:

            1. Read `.argus/prompts/system.md` — it defines your persona,
               rules, and the hard line that you never approve to merely clear a gate.
            2. Read `${{ inputs.config-path || '.github/argus/config.yml' }}` to learn
               which skills are enabled, the severity gate, and path rules
               (skip/strict globs).
            3. Load every enabled skill from `.argus/skills/<name>.md`. Each
               is a rubric.
            4. Load repo memory: `.github/argus/memory/conventions.md`,
               `.github/argus/memory/accepted-patterns.md`, and any relevant
               `.github/argus/memory/knowledge/*`. Treat accepted-patterns as
               authoritative — do NOT re-flag them.
            5. Get the diff: `gh pr diff ${{ github.event.pull_request.number || github.event.issue.number }}`.
               Read the surrounding code (not just diff hunks) for anything you're
               unsure about — false positives from missing context are the #1 way
               reviewers lose trust.
            6. For each enabled skill, apply its rubric and collect findings.
               Dedupe across skills. Assign each finding a severity
               (blocker | major | minor | nit) and a `file:line` citation.
            7. Follow `.argus/prompts/verdict.md` to decide + submit the review:
               - Post concise inline comments for real issues only.
               - Post a summary keyed by skill, with a findings table.
               - If any confirmed blocker/major → `gh pr review <n> --request-changes`.
               - Else → `gh pr review <n> --comment`.
               - Only `--approve` if `verdict.allow_approve: true` in config AND you
                 have zero blocker/major findings AND you would genuinely sign off.
            8. If you notice a pattern the repo keeps accepting, or a convention
               worth recording, add a short "📝 Memory suggestion" section — a human
               will decide whether to merge it into `.github/argus/memory/`.

            If any harness file above is missing, say so explicitly at the top of
            your review instead of silently falling back to an unguided review.

            Be concrete, cite file:line, and prefer precision over volume.
          claude_args: >-
            --model ${{ inputs.model || 'claude-sonnet-4-6' }}
            --allowedTools "Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(gh pr comment:*),Read,Grep,Glob"

      # claude-code-action exits 0 in two situations where it reviewed nothing:
      # an absent credential, and its workflow-validation guard (it refuses to run
      # when this file differs from the copy on the repo's default branch — normal
      # on the PR that introduces or edits it). A green check that reviewed nothing
      # is the one outcome a mandatory review gate must never produce.
      - name: Verify Argus actually reviewed
        env:
          CONCLUSION: ${{ steps.argus.outputs.conclusion }}
        run: |
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error title=Argus did not review this PR::claude-code-action finished without reviewing (conclusion='"'"'${CONCLUSION:-<empty>}'"'"'). Most often this is the action'"'"'s workflow-validation guard: it only runs when .github/workflows/argus.yml on this branch is identical to the copy on the repository default branch. That is expected on a PR that adds or edits this workflow and clears once it merges. Failing here on purpose: a skipped run must never read as a passing review."
            exit 1
          fi
          echo "Argus completed a review (conclusion=success)."
